services:
  mariadb-node1:
    image: mariadb:lts
    container_name: mariadb-galera-node1
    hostname: mariadb-node1
    restart: unless-stopped
    network_mode: host

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      TZ: "${TZ}"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ${CONFIG_BASE_PATH}/conf/galera-prd1.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ${CONFIG_BASE_PATH}/init-scripts:/docker-entrypoint-initdb.d:ro
      - mariadb_logs:/var/log/mysql

    # Smart bootstrap: Uses --wsrep-new-cluster ONLY if BOOTSTRAP_NODE1=yes
    # For initial deployment: Set BOOTSTRAP_NODE1=yes in .env
    # After cluster is running: Remove BOOTSTRAP_NODE1 or set to empty in Portainer environment variables
    # Safe for reboots when BOOTSTRAP_NODE1 is unset or empty
    command:
      - bash
      - -c
      - |
        if [ "$BOOTSTRAP_NODE1" = "yes" ]; then
          echo "### Starting NEW Galera cluster (bootstrap node) ###"
          exec docker-entrypoint.sh mariadbd \
            --wsrep-new-cluster \
            --wsrep_cluster_name="$CLUSTER_NAME" \
            --wsrep_cluster_address=gcomm://$HOST1_IP:4567,$HOST2_IP:4567 \
            --wsrep_node_name=prd1 \
            --wsrep_node_address=$HOST1_IP \
            --wsrep_sst_auth="$SST_USER:$SST_PASSWORD"
        else
          echo "### Joining existing Galera cluster ###"
          exec docker-entrypoint.sh mariadbd \
            --wsrep_cluster_name="$CLUSTER_NAME" \
            --wsrep_cluster_address=gcomm://$HOST1_IP:4567,$HOST2_IP:4567 \
            --wsrep_node_name=prd1 \
            --wsrep_node_address=$HOST1_IP \
            --wsrep_sst_auth="$SST_USER:$SST_PASSWORD"
        fi

    healthcheck:
      disable: true

volumes:
  mariadb_data:
    driver: local
  mariadb_logs:
    driver: local
